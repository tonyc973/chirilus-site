<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="alternate" type="application/rss+xml" title="Antonie Chirilus — Writing" href="{{ROOT}}feed.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg:        '#0A0A0B',
            'bg-2':    '#0F0F11',
            surface:   '#121215',
            elev:      '#17171C',
            border:    '#1E1E24',
            'border-2':'#2A2A32',
            'border-3':'#3A3A45',
            text:      '#FAFAFA',
            muted:     '#9494A0',
            'muted-2': '#6B6B76',
            faint:     '#48484F',
            accent:    '#FF5C28',
            'accent-2':'#FF7A4D',
          },
          fontFamily: {
            sans: ['"Geist"', 'system-ui', 'sans-serif'],
            mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
          },
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-feature-settings: "ss01" on, "ss03" on, "cv11" on; }
    ::selection { background: #FF5C28; color: #0A0A0B; }
    .tabnum { font-feature-settings: "tnum" 1, "lnum" 1; }
    .grid-bg {
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 80%);
    }
    .card {
      transition: border-color 220ms ease, background-color 220ms ease, transform 220ms ease;
    }
    .card:hover { border-color: #3A3A45; background-color: #17171C; transform: translateY(-1px); }
    .card:hover .card-arrow { color: #FF5C28; transform: translate(2px, -2px); }
    .card-arrow { transition: color 220ms ease, transform 220ms ease; }
    .row { transition: background-color 220ms ease; }
    .row:hover { background-color: rgba(255,255,255,0.018); }
    .row:hover .row-title { color: #FFFFFF; }
    .row:hover .row-arrow { opacity: 1; transform: translateX(3px); color: #FF5C28; }
    .row-title { transition: color 220ms ease; }
    .row-arrow { opacity: 0; transition: opacity 220ms ease, transform 220ms ease, color 220ms ease; display: inline-block; }
    .pulse-dot {
      position: relative; display: inline-flex; width: 7px; height: 7px;
    }
    .pulse-dot::before {
      content:""; position: absolute; inset: 0; border-radius: 9999px; background: #FF5C28;
      opacity: 0.55; animation: ping 1.8s cubic-bezier(0,0,0.2,1) infinite;
    }
    .pulse-dot::after {
      content:""; position: absolute; inset: 0; border-radius: 9999px; background: #FF5C28;
    }
    @keyframes ping {
      0%   { transform: scale(1);   opacity: 0.55; }
      75%  { transform: scale(2.6); opacity: 0; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    .section-num { font-family: 'Geist Mono', monospace; color: #FF5C28; }
    .reveal { opacity: 0; transform: translateY(8px); transition: opacity 600ms ease, transform 600ms ease; }
    .reveal.in { opacity: 1; transform: none; }
    .underline-link { background-image: linear-gradient(currentColor,currentColor); background-size: 0% 1px; background-repeat: no-repeat; background-position: 0 100%; transition: background-size 220ms ease, color 220ms ease; }
    .underline-link:hover { background-size: 100% 1px; }
    nav a, button { -webkit-tap-highlight-color: transparent; }

    /* prose styles for blog post bodies */
    .prose { color: #D4D4DA; font-size: 1.05rem; line-height: 1.72; }
    .prose > * + * { margin-top: 1.4em; }
    .prose h2 { color: #FAFAFA; font-size: 1.6rem; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; margin-top: 2.6em; margin-bottom: 0.6em; }
    .prose h3 { color: #FAFAFA; font-size: 1.2rem; font-weight: 500; letter-spacing: -0.015em; margin-top: 2em; margin-bottom: 0.4em; }
    .prose h4 { color: #FAFAFA; font-size: 1rem; font-weight: 500; margin-top: 1.6em; margin-bottom: 0.3em; }
    .prose a { color: #FAFAFA; text-decoration: underline; text-decoration-color: #3A3A45; text-underline-offset: 4px; transition: text-decoration-color 220ms ease; }
    .prose a:hover { text-decoration-color: #FF5C28; }
    .prose strong { color: #FAFAFA; font-weight: 600; }
    .prose em { font-style: italic; color: #E4E4EA; }
    .prose code { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.88em; background: #17171C; border: 1px solid #1E1E24; padding: 0.12em 0.42em; border-radius: 4px; color: #FF7A4D; }
    .prose pre { background: #0F0F11; border: 1px solid #1E1E24; border-radius: 8px; padding: 1.1em 1.3em; overflow-x: auto; font-size: 0.86rem; line-height: 1.6; }
    .prose pre code { background: transparent; border: none; padding: 0; color: inherit; font-size: inherit; }
    .prose blockquote { border-left: 2px solid #FF5C28; padding-left: 1.2em; color: #9494A0; font-style: italic; }
    .prose ul, .prose ol { padding-left: 1.4em; }
    .prose ul > li { list-style: disc; }
    .prose ol > li { list-style: decimal; }
    .prose ul > li::marker, .prose ol > li::marker { color: #6B6B76; }
    .prose li + li { margin-top: 0.4em; }
    .prose hr { border: 0; border-top: 1px solid #1E1E24; margin: 3em 0; }
    .prose img { border-radius: 8px; border: 1px solid #1E1E24; }
    .prose table { width: 100%; border-collapse: collapse; font-size: 0.95em; }
    .prose th, .prose td { border-bottom: 1px solid #1E1E24; padding: 0.6em 0.8em; text-align: left; }
    .prose th { color: #FAFAFA; font-weight: 500; }

{{SYNTAX_CSS}}
  </style>
</head>
<body class="bg-bg text-text font-sans antialiased">

<!-- ─────────────  STICKY PILL NAV  ───────────── -->
<nav class="fixed top-5 left-1/2 -translate-x-1/2 z-50">
  <div class="flex items-center gap-1 px-1.5 py-1.5 bg-bg-2/90 backdrop-blur-md border border-border-2 rounded-full shadow-[0_8px_30px_-12px_rgba(0,0,0,0.7)]">
    <a href="{{ROOT}}" class="px-3 py-1.5 text-[0.82rem] font-medium tracking-tight">AC</a>
    <span class="w-px h-4 bg-border"></span>
    <a href="{{ROOT}}#work" class="px-3 py-1.5 text-[0.82rem] text-muted hover:text-text rounded-full transition">Work</a>
    <a href="{{ROOT}}#writing" class="px-3 py-1.5 text-[0.82rem] text-muted hover:text-text rounded-full transition">Writing</a>
    <a href="{{ROOT}}#experience" class="px-3 py-1.5 text-[0.82rem] text-muted hover:text-text rounded-full transition hidden sm:inline-block">Experience</a>
    <span class="w-px h-4 bg-border"></span>
    <a href="{{ROOT}}#contact" class="px-3 py-1.5 text-[0.82rem] text-muted hover:text-text rounded-full transition">Contact</a>
  </div>
</nav>

{{CONTENT}}

<!-- ─────────────  FOOTER  ───────────── -->
<footer class="border-t border-border">
  <div class="max-w-[1120px] mx-auto px-6 md:px-10 py-8 flex flex-wrap items-center justify-between gap-y-3 font-mono text-[0.72rem] text-muted-2">
    <div class="flex items-center gap-3">
      <span class="pulse-dot"></span>
      <span>Available · Bucharest, GMT+2</span>
    </div>
    <div class="tabnum">
      © {{YEAR}} &nbsp; Antonie Chirilus &nbsp;·&nbsp; v.{{VERSION}}
    </div>
  </div>
</footer>

<script>
  const reveals = document.querySelectorAll('.reveal');
  reveals.forEach((el, i) => {
    setTimeout(() => el.classList.add('in'), 80 + i * 90);
  });
</script>

</body>
</html>
